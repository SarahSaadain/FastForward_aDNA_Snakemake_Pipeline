name: Lint

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  snakemake-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `snakemake --lint` currently reports 234 pre-existing findings across 89
      # rules/files (missing log: directives, missing per-rule conda envs, long
      # run: blocks, hardcoded params, plus some likely false positives on awk
      # script strings flagged as "absolute paths"). Re-enable once that backlog
      # has been triaged, or add `continue-on-error: true` to run it non-blocking
      # in the meantime.
