name: Auto Tag and Release

on:
  push:
    branches:
      - main

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bump version and create tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          release_branches: main

      - name: Update version.py from tag
        if: steps.tag.outputs.new_tag != ''
        run: |
          TAG=${{ steps.tag.outputs.new_tag }}
          VERSION=${TAG#v}
          sed -i "s/__version__ = .*/__version__ = \"$VERSION\"/" workflow/scripts/version.py

      - name: Update CHANGELOG.md
        if: steps.tag.outputs.new_tag != ''
        run: |
          VERSION=${{ steps.tag.outputs.new_version }}
          DATE=$(date -u +%Y-%m-%d)
          if grep -q "^## \[Unreleased\]" CHANGELOG.md; then
            awk -v version="$VERSION" -v date="$DATE" '
              /^## \[Unreleased\]/ && !done {
                print "## [Unreleased]"
                print ""
                print "## [" version "] - " date
                done = 1
                next
              }
              { print }
            ' CHANGELOG.md > CHANGELOG.md.tmp
            mv CHANGELOG.md.tmp CHANGELOG.md
          fi

      - name: Commit version.py and CHANGELOG.md back to main
        if: steps.tag.outputs.new_tag != ''
        run: |
          git config user.name "${{ github.event.head_commit.author.name }}"
          git config user.email "${{ github.event.head_commit.author.email }}"

          git add workflow/scripts/version.py CHANGELOG.md
          git commit -m "chore: sync version.py and CHANGELOG.md to ${{ steps.tag.outputs.new_tag }} [skip ci]" || true
          git push origin HEAD:main

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag != ''
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: pastForward ${{ steps.tag.outputs.new_tag }}
          generateReleaseNotes: true